<!DOCTYPE html>

<html class="dark" lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login | Mamet OS Ecosystem</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Geist:wght@600;700&amp;family=JetBrains+Mono:wght@500&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&amp;family=Inter:wght@100..900&amp;family=JetBrains+Mono:wght@100..900&amp;display=swap" rel="stylesheet"/>
<style>
        body {
            background-color: #0a0a0c;
            color: #e5e1e4;
            -webkit-font-smoothing: antialiased;
        }
        .glass-panel {
            background: rgba(22, 22, 26, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid #27272a;
            box-shadow: 0px 20px 40px rgba(0, 82, 255, 0.05);
        }
        .rim-light {
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }
        .input-etched {
            background-color: #0e0e10;
            border: 1px solid #27272a;
            transition: all 0.2s ease-in-out;
        }
        .input-etched:focus {
            border-color: #0052ff;
            box-shadow: 0 0 0 2px rgba(0, 82, 255, 0.2);
            outline: none;
        }
        .btn-glow:hover {
            box-shadow: 0 0 15px rgba(0, 82, 255, 0.4);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface": "#131315",
                      "surface-container-lowest": "#0e0e10",
                      "error-container": "#93000a",
                      "on-primary-fixed-variant": "#0038b6",
                      "surface-container-highest": "#353437",
                      "on-error-container": "#ffdad6",
                      "on-secondary-container": "#b6b4b9",
                      "primary": "#b7c4ff",
                      "primary-fixed": "#dde1ff",
                      "surface-container": "#201f21",
                      "primary-fixed-dim": "#b7c4ff",
                      "primary-container": "#0052ff",
                      "on-tertiary-fixed-variant": "#47464a",
                      "tertiary-container": "#666569",
                      "on-background": "#e5e1e4",
                      "inverse-surface": "#e5e1e4",
                      "secondary": "#c8c5cb",
                      "surface-bright": "#39393b",
                      "tertiary": "#c8c6c9",
                      "on-surface-variant": "#c3c5d9",
                      "on-primary-container": "#dfe3ff",
                      "secondary-container": "#47464b",
                      "surface-container-high": "#2a2a2c",
                      "surface-tint": "#b7c4ff",
                      "inverse-primary": "#004ced",
                      "on-primary": "#002682",
                      "inverse-on-surface": "#313032",
                      "secondary-fixed-dim": "#c8c5cb",
                      "on-tertiary-container": "#e6e3e7",
                      "outline-variant": "#434656",
                      "on-primary-fixed": "#001452",
                      "secondary-fixed": "#e4e1e7",
                      "on-tertiary-fixed": "#1b1b1e",
                      "surface-dim": "#131315",
                      "on-secondary-fixed": "#1b1b1f",
                      "background": "#131315",
                      "on-tertiary": "#303033",
                      "on-error": "#690005",
                      "surface-container-low": "#1c1b1d",
                      "tertiary-fixed-dim": "#c8c6c9",
                      "surface-variant": "#353437",
                      "outline": "#8d90a2",
                      "error": "#ffb4ab",
                      "on-surface": "#e5e1e4",
                      "tertiary-fixed": "#e4e1e5",
                      "on-secondary-fixed-variant": "#47464b",
                      "on-secondary": "#303034"
              },
              "borderRadius": {
                      "DEFAULT": "1rem",
                      "lg": "2rem",
                      "xl": "3rem",
                      "full": "9999px"
              },
              "spacing": {
                      "unit": "4px",
                      "margin-desktop": "64px",
                      "container-max": "1440px",
                      "margin-mobile": "16px",
                      "gutter": "24px"
              },
              "fontFamily": {
                      "display-lg": ["Geist"],
                      "label-mono": ["JetBrains Mono"],
                      "body-sm": ["Inter"],
                      "headline-md": ["Geist"],
                      "body-base": ["Inter"]
              },
              "fontSize": {
                      "label-mono": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500"}],
                      "body-sm": ["14px", {"lineHeight": "20px", "letterSpacing": "0", "fontWeight": "400"}],
                      "headline-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                      "body-base": ["16px", {"lineHeight": "24px", "letterSpacing": "0", "fontWeight": "400"}],

              }
            },
          },
        }

</head>
<body class="flex flex-col min-h-screen">
<!-- TopNavBar -->
<header class="w-full top-0 left-0 bg-surface dark:bg-surface border-b border-outline-variant/10 z-50">
<div class="flex justify-between items-center px-margin-mobile md:px-margin-desktop py-4 w-full max-w-container-max mx-auto">
<div class="font-headline-md text-headline-md font-bold text-on-surface">Mamet OS Ecosystem</div>
<nav class="hidden md:flex items-center gap-8"></nav>
</div>
</header>
<main class="flex-grow flex items-center justify-center relative px-margin-mobile py-12 overflow-hidden">
<!-- Atmospheric Background Animation -->
<div class="relative w-full max-w-md z-10">
<!-- Center Card -->
<div class="glass-panel rim-light rounded-xl p-8 md:p-10">
<div class="text-center mb-10">
<h1 class="font-headline-md text-headline-md text-on-surface mb-2">Selamat Datang</h1>
<p class="font-body-base text-body-base text-on-surface-variant">Masuk ke ruang kerja pribadi Anda</p>
</div>
<form class="space-y-6" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="space-y-2">
<label class="block font-label-mono text-label-mono text-secondary uppercase tracking-wider" for="email">Email</label>
<input class="w-full px-4 py-3 rounded-DEFAULT font-body-base text-body-base text-on-surface input-etched" id="email" placeholder="nama@email.com" type="email"/>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="block font-label-mono text-label-mono text-secondary uppercase tracking-wider" for="password">Kata Sandi</label>
<a class="font-label-mono text-label-mono text-primary hover:underline transition-all" href="#">Lupa Kata Sandi?</a>
</div>
<input class="w-full px-4 py-3 rounded-DEFAULT font-body-base text-body-base text-on-surface input-etched" id="password" placeholder="••••••••" type="password"/>
</div>
<!-- Primary Button -->
<button class="w-full py-4 bg-primary-container text-on-primary-container font-headline-md text-[16px] font-bold rounded-DEFAULT btn-glow transition-all duration-200 ease-in-out active:scale-[0.98]" type="submit">
                        Masuk
                    </button><div class="text-center mt-4"><p class="font-body-sm text-body-sm text-on-surface-variant">Belum punya akun? <a class="text-primary hover:underline transition-all" href="#">Daftar</a></p></div>
</form>
<!-- Social Login -->
</div>
<!-- Contextual Decorative Elements -->
<div class="absolute -bottom-12 -right-12 w-32 h-32 bg-primary/10 blur-[80px] rounded-full pointer-events-none"></div>
<div class="absolute -top-12 -left-12 w-32 h-32 bg-secondary/5 blur-[80px] rounded-full pointer-events-none"></div>
</div>
</main>
<!-- Footer -->
<footer class="w-full bottom-0 bg-surface dark:bg-surface border-t border-outline-variant/10">
<div class="flex flex-col md:flex-row justify-between items-center px-margin-mobile md:px-margin-desktop py-8 w-full max-w-container-max mx-auto gap-4">
<div class="font-label-mono text-label-mono text-on-surface">@2026 mametdev</div>
</div>
</footer>
<script>
        // Simple micro-interaction for button press effect
        const loginBtn = document.querySelector('button[type="submit"]');
        loginBtn.addEventListener('click', () => {
            loginBtn.classList.add('scale-[0.98]');
            setTimeout(() => loginBtn.classList.remove('scale-[0.98]'), 150);
        });

        // Focus ring ripple logic can be added here if needed for higher fidelity
    </script>
</body></html>
