name: Mamet OS Production Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate-environment:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔍 Security Audit (Secret Leakage Check)
        run: |
          echo "Scanning for hardcoded secrets..."
          # Prevent deployment if hardcoded GEMINI or SUPABASE keys are found in source code (excluding .env)
          ! grep -r -i "GEMINI_API_KEY=" ./supabase/functions || exit 1
          ! grep -r -i "SUPABASE_SERVICE_ROLE_KEY=" ./supabase/functions || exit 1

  build-frontend:
    runs-on: windows-latest
    needs: validate-environment
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: 🔨 Validate Frontend Build
        working-directory: ./frontend
        run: npm run build

  deploy-edge-functions:
    runs-on: ubuntu-latest
    needs: build-frontend
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: 🚀 Deploy Agent Process
        run: |
          echo "Simulating Edge Function Deployment Validation..."
          # supabase functions deploy agent-process --project-ref $SUPABASE_PROJECT_ID
