name: Build and Release Mamet AI

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/package.json' # Hanya build kalau ada perubahan versi di package.json
  workflow_dispatch: # Memungkinkan Anda menekan tombol "Run workflow" secara manual di GitHub

jobs:
  build:
    runs-on: windows-latest # Kita gunakan environment Windows karena Anda nge-build .exe

    permissions:
      contents: write # Wajib agar robot GitHub diizinkan membuat Release baru

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: 🚀 Build and Publish .exe
        working-directory: ./frontend
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }} # Pakai token PAT baru yang kita buat untuk akses lintas-repository
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }} # Paksa override GITHUB_TOKEN bawaan GitHub Actions
        run: npm run dist:publish
