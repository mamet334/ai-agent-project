name: Handoff Context Auto-Sync

on:
  push:
    branches:
      - main

jobs:
  sync-handoff:
    name: Sync Architecture State
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit back to the repo
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Fetch depth 2 is required to perform a git diff against the previous commit
          fetch-depth: 2 

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Auto-Sync Handoff Generator
        run: node scripts/generate-handoff.js

      - name: Commit and Push Changes
        run: |
          # Configure git identity
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage the handoff file
          git add "handoff context untuk chatgpt.txt"
          
          # Check if there are actual changes before committing
          if git diff --staged --quiet; then
            echo "No updates to handoff file generated. Skipping commit."
          else
            # Append [skip ci] to prevent infinite loop of GitHub actions
            git commit -m "chore: auto-update handoff context snapshot [skip ci]"
            git push
            echo "Handoff context successfully synced and pushed!"
          fi
