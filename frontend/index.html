<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co https://*.supabase.in https://generativelanguage.googleapis.com https://r.jina.ai https://lite.duckduckgo.com https://images.search.yahoo.com https://*.apify.com wss://*.supabase.co; media-src 'self' blob:;" />
    <title>AI Agent</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        try {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for(let registration of registrations) {
              registration.unregister();
            }
          }).catch(function() {});
        } catch(e) {}
      }
    </script>
    <div id="app-version" style="position: fixed; bottom: 8px; right: 12px; font-size: 11px; color: #aaa; background: rgba(0,0,0,0.5); padding: 2px 8px; border-radius: 12px; z-index: 9999; font-family: monospace;">
      v<span id="version-number">...</span>
    </div>
    <script>
      if (window.electronAPI && window.electronAPI.getAppVersion) {
        window.electronAPI.getAppVersion().then(v => {
          document.getElementById('version-number').innerText = v;
        }).catch(() => {});
      }
    </script>
  </body>
</html>
